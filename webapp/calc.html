<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Розрахунки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f4f1ec);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1b1f);
    --hint: var(--tg-theme-hint-color, #77757d);
    --accent: var(--tg-theme-button-color, #1c1b1f);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127, 127, 127, .22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg);
         color: var(--text); padding-bottom: 96px; }
  .tabs { position: sticky; top: 0; z-index: 2; display: flex; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab { flex: 1; padding: 14px 4px; text-align: center; font-size: 16px; color: var(--hint); border: 0; background: none;
         font-weight: 600; border-bottom: 3px solid transparent; }
  .tab.on { color: var(--text); border-bottom-color: #c0392b; }
  .wrap { padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 6px; }
  .sub { color: var(--hint); margin: 0 0 16px; font-size: 15px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .field + .field { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row > div:first-child { flex: 1; min-width: 0; }
  .label { font-size: 17px; font-weight: 600; }
  .hint { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .val { flex: none; width: 172px; border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px; text-align: right;
         font-size: 20px; font-weight: 700; display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; }
  .val input::placeholder { color: var(--hint); }
  .val input { width: 100%; min-width: 0; border: 0; background: none; font: inherit; color: var(--text); text-align: right; outline: none; }
  .val span { font-size: 15px; font-weight: 500; color: var(--hint); }
  .slide { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .pm { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: none; color: var(--text);
        font-size: 24px; line-height: 1; flex: none; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .res { background: var(--card); border-radius: 20px; padding: 18px 16px; }
  .res .big { font-size: 30px; font-weight: 800; margin: 4px 0 10px; }
  .res .line { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .res .line b { white-space: nowrap; }
  .note { color: var(--hint); font-size: 13px; margin-top: 12px; line-height: 1.4; }
  .go { position: fixed; left: 16px; right: 16px; bottom: 16px; height: 56px; border: 0; border-radius: 18px;
        background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 700; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="tabs">
  <button class="tab on" data-k="save">Накопичити</button>
  <button class="tab" data-k="pension">Пенсія</button>
  <button class="tab" data-k="kids">Дитині</button>
</div>

<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="card" id="fields"></div>
  <div class="res" id="res"></div>
  <p class="note">Дохідність {{RATE}}% на рік, внесок щороку зростає на {{INDEX}}% (індексація)<br>
    ❗ Розрахунок орієнтовний<br>Точно під вашу ситуацію порахуємо на безкоштовній консультації</p>
</div>
<button class="go" id="go">Записатися на консультацію</button>

<script>
const RATE = {{RATE}}, INDEX = {{INDEX}}, PENSION_YEARS = {{PENSION_YEARS}};
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Однакова формула з calc.py: внесок на початку місяця, щомісячна дохідність, внесок щороку +індексація
function grow(monthly, years) {
  const r = RATE / 100 / 12, idx = INDEX / 100;
  let paid = 0, cap = 0, c = monthly;
  for (let y = 0; y < years; y++) {
    for (let m = 0; m < 12; m++) { cap = (cap + c) * (1 + r); paid += c; }
    c *= 1 + idx;
  }
  return [paid, cap];
}
const money = x => Math.round(x).toLocaleString("uk-UA").replace(/ /g, " ");

const CALCS = {
  save: { title: "Скільки я накопичу", sub: "Кілька цифр, і побачите свій капітал",
    fields: [["monthly", "Відкладаю на місяць", "", 500, 50000, 100, 1000, "грн"],
             ["yearly", "Відкладаю на рік", "", 6000, 600000, 1200, 12000, "грн"],
             ["years", "Скільки років", "від 1 до 40", 1, 40, 1, 10, "р."]] },
  pension: { title: "Яка буде моя пенсія", sub: "Скільки накопичите до пенсії і на скільки вистачить",
    fields: [["age", "Вік зараз", "18-65 років", 18, 65, 1, 35, "р."],
             ["retire", "Вік виходу на пенсію", "коли хочете отримувати пенсію", 45, 75, 1, 60, "р."],
             ["monthly", "Відкладаю на місяць", "", 500, 50000, 100, 1000, "грн"],
             ["yearly", "Відкладаю на рік", "", 6000, 600000, 1200, 12000, "грн"]] },
  kids: { title: "Капітал для дитини", sub: "Накопичення для дитини до 27 років",
    fields: [["child_age", "Вік дитини зараз", "0-18 років", 0, 18, 1, 0, "р."],
             ["target", "До якого віку накопичуємо", "до 27 років", 1, 27, 1, 18, "р."],
             ["monthly", "Відкладаю на місяць", "", 500, 50000, 100, 1000, "грн"],
             ["yearly", "Відкладаю на рік", "", 6000, 600000, 1200, 12000, "грн"]] },
};

let kind = new URLSearchParams(location.search).get("tab");
if (!CALCS[kind]) kind = "save";
document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.k === kind));
const vals = {};
const shows = {};  // показати нове число в полі без перерахунку (для пов'язаних «на місяць» і «на рік»)

function render() {
  const c = CALCS[kind];
  document.getElementById("title").textContent = c.title;
  document.getElementById("sub").textContent = c.sub;
  const box = document.getElementById("fields");
  box.innerHTML = "";
  c.fields.forEach(([key, label, hint, lo, hi, step, def, unit]) => {
    if (vals[kind + key] === undefined) vals[kind + key] = key === "yearly" ? vals[kind + "monthly"] * 12 : def;
    const f = document.createElement("div");
    f.className = "field";
    f.innerHTML = `<div class="row"><div><div class="label">${label}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>
      <label class="val"><input type="text" inputmode="numeric" enterkeyhint="done" value="${money(vals[kind + key])}"><span>${unit}</span></label></div>
      <div class="slide"><button class="pm" data-d="-1">−</button>
      <input type="range" min="${lo}" max="${hi}" step="${step}" value="${vals[kind + key]}">
      <button class="pm" data-d="1">+</button></div>`;
    const num = f.querySelector(".val input"), rng = f.querySelector("input[type=range]");
    shows[key] = v => { vals[kind + key] = v; num.value = money(v); rng.value = v; };
    const set = v => {
      v = Math.max(lo, Math.min(hi, Math.round(v)));
      shows[key](v);
      if (key === "monthly" && shows.yearly) shows.yearly(v * 12);       // на місяць → на рік
      if (key === "yearly" && shows.monthly) shows.monthly(Math.round(v / 12));  // на рік → на місяць
      if (key === "child_age" && shows.target && vals[kind + "target"] <= v) shows.target(Math.min(27, v + 1));
      if (key === "age" && shows.retire && vals[kind + "retire"] <= v) shows.retire(v + 1);
      calcNow();
    };
    rng.oninput = () => set(+rng.value);
    // Ручне введення: торкнулись віконця, воно очищається (старе число видно світлою підказкою), пишете своє.
    // Поки людина пише, результат рахується одразу; коли закінчила, число стає в межі і з пробілами.
    const typed = () => +String(num.value).replace(/\D/g, "");
    num.onfocus = () => { num.placeholder = money(vals[kind + key]); num.value = ""; goDone(true); };
    num.oninput = () => {
      const v = typed();
      if (v >= lo && v <= hi) {
        vals[kind + key] = v; rng.value = v;
        if (key === "monthly" && shows.yearly) shows.yearly(v * 12);
        if (key === "yearly" && shows.monthly) shows.monthly(Math.round(v / 12));
        calcNow();
      }
    };
    num.onblur = () => { set(typed() || vals[kind + key]); goDone(false); };
    num.onkeydown = e => { if (e.key === "Enter") num.blur(); };
    f.querySelectorAll(".pm").forEach(b => b.onclick = () => {
      set(vals[kind + key] + step * +b.dataset.d);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });
    box.appendChild(f);
  });
  calcNow();
}

function current() {
  const o = { kind };
  CALCS[kind].fields.forEach(([key]) => o[key] = vals[kind + key]);
  if (kind === "pension" && o.retire <= o.age) o.retire = o.age + 1;
  if (kind === "kids" && o.target <= o.child_age) o.target = Math.min(27, o.child_age + 1);
  return o;
}

function calcNow() {
  const o = current(), res = document.getElementById("res");
  let years = kind === "save" ? o.years : kind === "pension" ? o.retire - o.age : o.target - o.child_age;
  const [paid, cap] = grow(o.monthly, years);
  let html = `<div class="hint">${kind === "kids" ? `Коли дитині виповниться ${o.target}, буде` : kind === "pension" ? "До пенсії накопичиться" : "У вас буде"}</div>
    <div class="big">${money(cap)} грн</div>
    <div class="line"><span>Ви внесете за ${years} р.</span><b>${money(paid)} грн</b></div>`;
  if (kind === "pension") {
    if (o.retire <= o.age) html += `<div class="line"><span>Вік пенсії має бути більшим за ваш вік</span></div>`;
    PENSION_YEARS.forEach(n => html += `<div class="line"><span>Пенсія на ${n} років</span><b>${money(cap / (12 * n))} грн/міс</b></div>`);
  }
  res.innerHTML = html;
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  kind = t.dataset.k; render(); window.scrollTo(0, 0);
});

// Поки людина вписує число, велика кнопка стає «✓ Готово» і ховає клавіатуру
const go = document.getElementById("go"), GO_TEXT = go.textContent;
let doneMode = false, doneTimer = null;
function goDone(on) {
  clearTimeout(doneTimer);
  if (on) { doneMode = true; go.textContent = "✓ Готово"; return; }
  // трохи чекаємо: натискання на «Готово» спершу забирає фокус з віконця, а вже потім спрацьовує кнопка
  doneTimer = setTimeout(() => { doneMode = false; go.textContent = GO_TEXT; }, 400);
}
go.onclick = () => {
  if (doneMode) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    clearTimeout(doneTimer); doneMode = false; go.textContent = GO_TEXT;
    return;
  }
  const data = JSON.stringify(current());
  if (tg && tg.sendData) tg.sendData(data); // агент отримає цифри, сам перерахує і запропонує запис
};

render();
</script>
</body>
</html>
